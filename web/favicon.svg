<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fundo Noturno Sacro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e2e"/>
      <stop offset="50%" stop-color="#0d121d"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- Gradiente de Ouro Sacro Celestial -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5bd"/>
      <stop offset="35%" stop-color="#f3ce72"/>
      <stop offset="70%" stop-color="#e0b043"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>

    <!-- Brilho Dourado Radiante -->
    <radialGradient id="haloGlow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#e0b043" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#e0b043" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e0b043" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombra para Profundidade Tridimensional -->
    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo com Cantos Arredondados Elegantes -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Borda de Filigrana Dourada Dupla -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.9"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#e0b043" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.45"/>

  <!-- Halo de Luz Celestial -->
  <circle cx="32" cy="25" r="22" fill="url(#haloGlow)"/>

  <!-- As Escrituras Sagradas Abertas (Códice Bíblico) na Base -->
  <g filter="url(#goldDrop)">
    <!-- Páginas Esquerdas -->
    <path d="M13 46 C19 44, 26 44, 32 47 C32 49.5, 32 52, 32 53.5 C26 50.5, 19 50.5, 13 52.5 Z" fill="#1b2333" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Páginas Direitas -->
    <path d="M51 46 C45 44, 38 44, 32 47 C32 49.5, 32 52, 32 53.5 C38 50.5, 45 50.5, 51 52.5 Z" fill="#1b2333" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>
    
    <!-- Lombada Central do Livro -->
    <path d="M32 47 L32 54" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- A Cruz Latina Expositiva (Sola Scriptura / Cristocêntrica) -->
  <g filter="url(#goldDrop)">
    <!-- Haste Vertical -->
    <path d="M29.5 12 C29.5 10.8, 30.2 10, 32 10 C33.8 10, 34.5 10.8, 34.5 12 L34.5 44 L29.5 44 Z" fill="url(#goldGrad)"/>
    
    <!-- Travessão Horizontal -->
    <path d="M17 21 C15.8 21, 15 21.8, 15 23 C15 24.2, 15.8 25, 17 25 L47 25 C48.2 25, 49 24.2, 49 23 C49 21.8, 48.2 21, 47 21 Z" fill="url(#goldGrad)"/>

    <!-- Ponta Superior Flamboyante / Serifada -->
    <path d="M28.5 12 L32 8 L35.5 12 Z" fill="url(#goldGrad)"/>
    <!-- Ponta Esquerda -->
    <path d="M17 20.5 L13 23 L17 25.5 Z" fill="url(#goldGrad)"/>
    <!-- Ponta Direita -->
    <path d="M47 20.5 L51 23 L47 25.5 Z" fill="url(#goldGrad)"/>

    <!-- Centro Luminous Radiante (A Cruz Viva) -->
    <circle cx="32" cy="23" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="23" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.75"/>
  </g>
</svg>
