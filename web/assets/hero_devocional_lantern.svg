<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Noturno / Crepúsculo -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705"/>
      <stop offset="40%" stop-color="#140e0a"/>
      <stop offset="75%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>

    <!-- Brilho Dourado Quente da Lanterna -->
    <radialGradient id="lanternGlow" cx="72%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#78350f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilho Suave na Bíblia -->
    <radialGradient id="bibleGlow" cx="60%" cy="58%" r="40%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Madeira da Mesa -->
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241911"/>
      <stop offset="30%" stop-color="#1c130d"/>
      <stop offset="70%" stop-color="#140c07"/>
      <stop offset="100%" stop-color="#0b0704"/>
    </linearGradient>

    <!-- Couro da Bíblia -->
    <linearGradient id="leatherCover" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1b120c"/>
      <stop offset="50%" stop-color="#2b1a10"/>
      <stop offset="100%" stop-color="#150d08"/>
    </linearGradient>

    <!-- Páginas Douradas / Pergaminho -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#846328"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#96702c"/>
    </linearGradient>

    <!-- Vinheta Esquerda Dramática -->
    <linearGradient id="vignetteLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070503" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#070503" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#0a0705" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0705" stop-opacity="0"/>
    </linearGradient>

    <!-- Partículas Sutis de Luz -->
    <filter id="blurLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1920" height="800" fill="url(#nightSky)"/>

  <!-- Mesa de Madeira Rústica na Base -->
  <polygon points="0,520 1920,520 1920,800 0,800" fill="url(#woodTable)"/>
  <line x1="0" y1="520" x2="1920" y2="520" stroke="#3d2a1d" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="550" x2="1920" y2="550" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- Halo de Luz Difusa da Lanterna (Fundo) -->
  <circle cx="1420" cy="360" r="500" fill="url(#lanternGlow)" filter="url(#blurLight)"/>
  <circle cx="1200" cy="460" r="420" fill="url(#bibleGlow)" filter="url(#blurLight)"/>

  <!-- Silhueta da Lanterna a Óleo Antiga (À Direita) -->
  <g id="lantern" opacity="0.95">
    <!-- Base de Latão / Bronze -->
    <ellipse cx="1420" cy="480" rx="65" ry="24" fill="#24170d" stroke="#52391e" stroke-width="2"/>
    <ellipse cx="1420" cy="470" rx="55" ry="18" fill="#382414" stroke="#785329" stroke-width="1.5"/>

    <!-- Reservatório de Óleo -->
    <path d="M 1375 470 C 1370 425, 1470 425, 1465 470 Z" fill="#2d1c10" stroke="#6b4a24" stroke-width="1.5"/>

    <!-- Hastes de Proteção em Bronze -->
    <path d="M 1370 430 L 1375 290 Q 1420 280 1465 290 L 1470 430" fill="none" stroke="#6b4a24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1420" cy="350" r="45" fill="none" stroke="#8c6130" stroke-width="1.5" opacity="0.7"/>

    <!-- Globo de Vidro Iluminado -->
    <ellipse cx="1420" cy="360" rx="42" ry="65" fill="#fef08a" opacity="0.35"/>
    <ellipse cx="1420" cy="360" rx="30" ry="48" fill="#fed7aa" opacity="0.6"/>

    <!-- Chama Central da Torcida -->
    <ellipse cx="1420" cy="365" rx="14" ry="25" fill="#f59e0b"/>
    <ellipse cx="1420" cy="360" rx="7" ry="16" fill="#ffffff" opacity="0.95"/>

    <!-- Cúpula / Chaminé Superior -->
    <path d="M 1385 290 Q 1420 270 1455 290 L 1445 250 Q 1420 240 1395 250 Z" fill="#382414" stroke="#6b4a24" stroke-width="2"/>
    <!-- Argola de Transporte -->
    <circle cx="1420" cy="225" r="22" fill="none" stroke="#52391e" stroke-width="4"/>
  </g>

  <!-- Bíblia Sagrada Antiga em Couro Aberta sobre a Mesa -->
  <g id="bibleBook" transform="translate(100, 0)">
    <!-- Sombra Física Projetada da Bíblia na Mesa -->
    <ellipse cx="1180" cy="550" rx="280" ry="50" fill="#000000" opacity="0.65" filter="url(#blurLight)"/>

    <!-- Capa Inferior de Couro Marrom Antigo -->
    <path d="M 940 515 C 935 530, 940 550, 960 558 L 1380 545 C 1400 540, 1405 520, 1395 505 Z" fill="url(#leatherCover)" stroke="#3e2718" stroke-width="2"/>

    <!-- Borda Dourada das Folhas (Gilded Edges) -->
    <path d="M 955 510 C 970 525, 1140 535, 1170 535 L 1170 525 C 1140 525, 970 515, 955 500 Z" fill="url(#goldEdge)" opacity="0.9"/>
    <path d="M 1170 535 C 1200 535, 1370 520, 1385 505 L 1385 495 C 1370 510, 1200 525, 1170 525 Z" fill="url(#goldEdge)" opacity="0.9"/>

    <!-- Páginas Abertas em Pergaminho / Marfim Iluminado -->
    <!-- Bloco Esquerdo das Páginas -->
    <path d="M 960 495 C 1010 475, 1120 480, 1168 505 L 1168 522 C 1120 498, 1010 492, 958 510 Z" fill="#fdfbf7" stroke="#e2d5c0" stroke-width="1.2"/>
    <!-- Bloco Direito das Páginas (Recebendo Luz Forte da Lanterna) -->
    <path d="M 1168 505 C 1215 480, 1325 475, 1380 490 L 1380 505 C 1325 490, 1215 495, 1168 522 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>

    <!-- Lombada Central / Sulco da Encadernação -->
    <line x1="1168" y1="504" x2="1168" y2="524" stroke="#854d0e" stroke-width="2.5" opacity="0.6"/>

    <!-- Linhas Sutis Simulando Colunas de Texto das Escrituras -->
    <g opacity="0.22" stroke="#451a03" stroke-width="1.5">
      <line x1="990" y1="488" x2="1060" y2="486"/>
      <line x1="990" y1="493" x2="1065" y2="491"/>
      <line x1="990" y1="498" x2="1055" y2="496"/>
      <line x1="1080" y1="487" x2="1150" y2="493"/>
      <line x1="1080" y1="492" x2="1155" y2="498"/>
      <line x1="1080" y1="497" x2="1145" y2="503"/>

      <line x1="1185" y1="494" x2="1255" y2="488"/>
      <line x1="1185" y1="499" x2="1260" y2="493"/>
      <line x1="1185" y1="504" x2="1250" y2="498"/>
      <line x1="1275" y1="487" x2="1350" y2="485"/>
      <line x1="1275" y1="492" x2="1355" y2="490"/>
      <line x1="1275" y1="497" x2="1345" y2="495"/>
    </g>

    <!-- Fita Marcadora de Seda Vermelha / Carmesim -->
    <path d="M 1168 506 Q 1180 540, 1150 565 Q 1140 575, 1130 580" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Partículas de Poeira Dourada em Suspensão no Ar -->
  <g opacity="0.45" fill="#fef08a">
    <circle cx="1320" cy="380" r="2"/>
    <circle cx="1360" cy="330" r="1.5"/>
    <circle cx="1400" cy="410" r="2.5"/>
    <circle cx="1270" cy="450" r="1.8"/>
    <circle cx="1480" cy="340" r="1.2"/>
    <circle cx="1210" cy="420" r="2"/>
    <circle cx="1150" cy="380" r="1.5"/>
    <circle cx="1450" cy="440" r="2"/>
    <circle cx="1300" cy="310" r="1.2"/>
  </g>

  <!-- Vinheta Esquerda Sólida (Para Contraste e Legibilidade do Título e Versículo) -->
  <rect width="1250" height="800" fill="url(#vignetteLeft)"/>
</svg>
