name: Estudo Bíblico Diário & Publicação Web (GitHub Pages)

on:
  schedule:
    # Executa todos os dias às 06:23 UTC (03:23 horário de Brasília - minuto ímpar e fila limpa)
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar regeneração mesmo que o estudo de hoje já exista'
        required: false
        type: boolean
        default: false
      versiculo:
        description: 'Passagem manual opcional (ex: Romanos 8:28 ou Salmos 23:1)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gerar-estudo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta e Geração Teológica Diária
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash' }}
          BIBLIA_VERSAO: ${{ secrets.BIBLIA_VERSAO || 'nvi' }}
        run: |
          CMD="python main.py"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          if [ -n "${{ inputs.versiculo }}" ]; then
            CMD="$CMD --versiculo '${{ inputs.versiculo }}'"
          fi
          echo "Executando comando: $CMD"
          eval $CMD
          python -c "from src.storage import exportar_todos_estudos_para_web_data; exportar_todos_estudos_para_web_data()"

      - name: Salvar Novo Estudo e Dados Web no Repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Estudo Bíblico do Dia & Atualização Web [skip ci]"
          file_pattern: "estudos/*.md web/data.js"
          branch: ${{ github.ref_name || 'main' }}

  deploy-pages:
    # Executa sempre que gerar-estudo tiver sucesso ou se tiver sido pulado
    if: always() && !cancelled() && (needs.gerar-estudo.result == 'success' || needs.gerar-estudo.result == 'skipped')
    needs: [gerar-estudo]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do Repositório Atualizado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload dos Arquivos Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
