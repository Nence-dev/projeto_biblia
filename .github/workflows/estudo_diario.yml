name: Estudo Bíblico Diário & Publicação Web (GitHub Pages)

on:
  schedule:
    # Execuções matinais escalonadas (05:17, 05:47, 06:17, 06:47 BRT) imunes a congestionamento de fila
    - cron: '17 8 * * *'
    - cron: '47 8 * * *'
    - cron: '17 9 * * *'
    - cron: '47 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar regeneração mesmo que o estudo de hoje já exista'
        required: false
        type: boolean
        default: true
      versiculo:
        description: 'Passagem manual opcional (ex: Romanos 8:28 ou Salmos 23:1)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gerar-estudo:
    # Gera novo estudo no horário agendado ou acionamento manual
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta e Geração Teológica Diária (Idempotente)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          BIBLIA_VERSAO: ${{ secrets.BIBLIA_VERSAO || 'nvi' }}
        run: |
          python -c "
          import sys
          from src.storage import estudo_hoje_esta_completo

          is_schedule = '${{ github.event_name }}' == 'schedule'
          is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
          force_input = '${{ inputs.force }}' == 'true'
          tem_versiculo = bool('${{ inputs.versiculo }}')

          if is_schedule and estudo_hoje_esta_completo():
              print('✅ Estudo e devocional de hoje já existem íntegros. Encerrando execução redundante com sucesso.')
              sys.exit(0)

          if is_manual and not force_input and not tem_versiculo and estudo_hoje_esta_completo():
              print('✅ Estudo de hoje já existe e force está inativo. Encerrando sem regenerar.')
              sys.exit(0)

          import subprocess
          cmd = ['python', 'main.py', '--force']
          if tem_versiculo:
              cmd.extend(['--versiculo', '${{ inputs.versiculo }}'])
          print(f'Executando: {\" \".join(cmd)}')
          res = subprocess.run(cmd)
          if res.returncode != 0:
              sys.exit(res.returncode)

          from src.storage import exportar_todos_estudos_para_web_data
          exportar_todos_estudos_para_web_data()
          print('✅ Dados web exportados com sucesso.')
          "

      - name: Salvar Novo Estudo e Dados Web no Repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Estudo Bíblico do Dia & Atualização Web [skip ci]"
          file_pattern: "estudos/*.md web/data.js"
          branch: ${{ github.ref_name || 'main' }}

  deploy-pages:
    # Executa sempre que gerar-estudo tiver sucesso ou se tiver sido pulado
    if: always() && !cancelled() && (needs.gerar-estudo.result == 'success' || needs.gerar-estudo.result == 'skipped')
    needs: [gerar-estudo]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do Repositório Atualizado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload dos Arquivos Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
